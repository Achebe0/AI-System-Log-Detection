apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-agent-sa
  namespace: default
  labels:
    app: log-agent

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-agent-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-agent-rolebinding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: log-agent-role
subjects:
- kind: ServiceAccount
  name: log-agent-sa
  namespace: default
