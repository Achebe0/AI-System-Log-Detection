apiVersion: v1
kind: Service
metadata:
  name: log-agent-service
  namespace: default
  labels:
    app: log-agent
spec:
  type: ClusterIP
  selector:
    app: log-agent
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
# Optional: Headless service for direct pod access (if needed for monitoring)
apiVersion: v1
kind: Service
metadata:
  name: log-agent-headless
  namespace: default
  labels:
    app: log-agent
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: log-agent
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
