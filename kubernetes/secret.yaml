apiVersion: v1
kind: Secret
metadata:
  name: log-agent-secret
  namespace: default
type: Opaque
stringData:
  COHERE_API_KEY: "your_cohere_api_key_here"
  # This is base64 encoded when applied:
  # kubectl apply -f secret.yaml
  # 
  # To update from CLI:
  # kubectl create secret generic log-agent-secret --from-literal=COHERE_API_KEY=$YOUR_KEY --dry-run=client -o yaml | kubectl apply -f -
